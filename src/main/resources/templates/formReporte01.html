<!doctype html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" 
              rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" 
              crossorigin="anonymous">
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="/js/formReporte01.js"></script>
        <!-- comment 
        <link rel="stylesheet" href="/css/general.css">
        <script src="/js/lib.js"></script>
        -->

        <title>InfoT, S.A</title>
    </head>
    <body>
        <nav class="navbar navbar-dark bg-secondary">
            <a class="navbar-brand" href="/" data-th-href="@{/}">
                <img src="/img/Logo2.png" data-th-src="@{/img/Logo2.png}" width="30" height="30" alt="InfoT, S.A.">
                Inicio
            </a>            
        </nav>

        <div id="mainDiv" class="container mt-4">

            <h1>Parámetros del reporte</h1>

            <div class="row">
                <div class="col">
                    <label for="month" class="form-label">Mes</label>
                    <select class="form-control form-select mb-4" 
                            id="month" 
                            aria-label="Select a month">
                        <option selected value="1">Enero</option>
                        <option value="2">Febrero</option>
                        <option value="3">Marzo</option>
                        <option value="4">Abril</option>
                        <option value="5">Mayo</option>
                        <option value="6">Junio</option>
                        <option value="7">Julio</option>
                        <option value="8">Agosto</option>
                        <option value="9">Setiembre</option>
                        <option value="10">Octubre</option>
                        <option value="11">Noviembre</option>
                        <option value="12">Diciembre</option>
                    </select>
                </div>

                <div class="col">
                    <label for="year" class="form-label">Año</label>
                    <input type="number" min="2022" step="1" class="form-control" 
                           id="year" 
                           value="2022">
                </div>

                <div class="col">
                    <label for="receptor" class="form-label">Receptor</label>

                    <select class="form-control form-select mb-4" id="receptor" aria-label="Select a company">
                        <option data-th-each="c : ${companies}"
                                data-th-value="${c.numeroReceptor}"
                                data-th-text="${c.nombreReceptor}">
                        </option>
                    </select>
                </div>
                <div class="col">
                    <label for="nombreCom" class="form-label">Nombre comercial</label>

                    <select class="form-control form-select mb-4" id="nombreCom" aria-label="Select a business name">
                        <option data-th-each="e : ${empresas}"
                                data-th-value="${e.nombreComercial}"
                                data-th-text="${e.nombreComercial}">
                        </option>
                    </select>
                </div>
                <div class="col">
                    <label for="emisor" class="form-label">Emisor</label>

                    <select class="form-control form-select mb-4" id="emisor" aria-label="Select an emitter">
                        <option data-th-each="e : ${emisores}"
                                data-th-value="${e.numeroEmisor}"
                                data-th-text="${e.nombreEmisor}">
                        </option>
                    </select>
                </div>
                <div class="col">
                    <label for="tipoDoc" class="form-label">Tipo documento</label>

                    <select class="form-control form-select mb-4" 
                            id="tipoDoc" 
                            aria-label="Select a document type" 
                            >
                        <option selected value="todos">Todos</option>
                        <option value="FAC">Factura</option>
                        <option value="NCR">Nota de crédito</option>
                        <option value="NDB">Nota de débito</option>
                    </select>
                </div>
            </div>  
            <a href="/factura/reporte01/?year=2022&month=11&receptor=todos&tipoDoc=FAC&nombreCom=Todos" 
               class="btn btn-primary"
               id="link"
               target="_blank">Generar reporte</a><br>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
                integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" 
        crossorigin="anonymous"></script>
    </body>
</html>
